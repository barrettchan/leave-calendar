<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>同事請假表</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #dcdce2;
      --sun-col: #fdeded;
      --sun-text: #d9383a;
      --sat-col: #eef4fc;
      --sat-text: #2f6fd6;
      --weekday-col: #ffffff;
      --today-border: #1a73e8;
      --text: #222222;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .month-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .nav-btn-group { display: flex; gap: 6px; }
    .btn {
      background: #f0f0f3;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:active { background: #e0e0e5; }
    .btn-today { background: #e8f0fe; color: #1967d2; border-color: #aecbfa; }

    .weekdays-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #e9e9ee;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 0;
    }
    .weekdays-bar .sun { color: var(--sun-text); background: #fae2e2; }
    .weekdays-bar .sat { color: var(--sat-text); background: #dceafb; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(88px, 1fr);
      background: var(--border);
      gap: 1px;
      flex: 1;
    }

    .cell {
      background: var(--weekday-col);
      padding: 2px 2px 3px 2px;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .cell.sun-col { background: var(--sun-col); }
    .cell.sat-col { background: var(--sat-col); }
    .cell.other-month { opacity: 0.35; background: #fafafa; }
    .cell.today { box-shadow: inset 0 0 0 2px var(--today-border); }

    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
      padding: 0 1px;
    }
    .day-num {
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
    }
    .sun-col .day-num { color: var(--sun-text); }
    .sat-col .day-num { color: var(--sat-text); }

    .ph-label {
      font-size: 8px;
      color: #d93025;
      transform: scale(0.88);
      transform-origin: right center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72%;
    }

    .event-stream {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: hidden;
    }

    .item-card {
      background: rgba(0, 0, 0, 0.04);
      border-left: 2px solid #5c6bc0;
      border-radius: 2px;
      padding: 1px 2px;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .item-card .name-line {
      font-size: 9.5px;
      font-weight: 700;
      color: #202124;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-card .status-line {
      font-size: 8.5px;
      color: #555555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-card.ph {
      background: #fce8e6;
      border-left-color: #ea4335;
    }
    .item-card.ph .name-line {
      color: #c5221f;
      font-size: 9px;
    }

    .more-counter {
      font-size: 8px;
      color: var(--text-muted);
      text-align: right;
      padding-right: 2px;
    }

    .detail-tray {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.06);
    }
    .tray-header {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tray-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #eef2ff;
      color: #3f51b5;
    }
    .tray-content {
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .person-chip {
      background: #f1f3f4;
      padding: 5px 9px;
      border-radius: 5px;
      border-left: 3px solid #1a73e8;
      display: inline-flex;
      flex-direction: column;
      gap: 1px;
    }
    .chip-name { font-weight: 700; color: #202124; }
    .chip-desc { font-size: 0.75rem; color: #666; }
    .chip-ph {
      background: #fce8e6;
      border-left-color: #d93025;
      color: #c5221f;
      font-weight: 600;
      justify-content: center;
    }

    .fab-config {
      position: fixed;
      right: 14px;
      bottom: 74px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      opacity: 0.8;
      z-index: 10;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34a853;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="month-title">
      <span id="monthDisplay">2026年 10月</span>
      <span class="status-dot" id="syncDot" title="同步正常"></span>
    </div>
    <div class="nav-btn-group">
      <button class="btn" id="prevBtn">‹ 上月</button>
      <button class="btn btn-today" id="todayBtn">今月</button>
      <button class="btn" id="nextBtn">下月 ›</button>
    </div>
  </header>

  <div class="weekdays-bar">
    <div class="sun">週日</div>
    <div>週一</div>
    <div>週二</div>
    <div>週三</div>
    <div>週四</div>
    <div>週五</div>
    <div class="sat">週六</div>
  </div>

  <div class="calendar-grid" id="grid"></div>

  <div class="detail-tray" id="tray">
    <div class="tray-header">
      <span id="trayDateText">請選擇日期</span>
      <span class="tray-badge" id="trayCountText">0 人休假</span>
    </div>
    <div class="tray-content" id="trayList">
      點選月曆格以查看當日放假詳情
    </div>
  </div>

  <div class="fab-config" onclick="manualRefresh()" title="重新同步 Google 日曆">🔄</div>

  <script>
    const HK_PUBLIC_HOLIDAYS = {
      "2026-01-01": "元旦",
      "2026-02-17": "農曆年初一",
      "2026-02-18": "農曆年初二",
      "2026-02-19": "農曆年初三",
      "2026-04-03": "耶穌受難節",
      "2026-04-04": "清明節",
      "2026-04-06": "復活節星期一",
      "2026-05-01": "勞動節",
      "2026-05-24": "佛誕",
      "2026-05-25": "佛誕翌日",
      "2026-06-19": "端午節",
      "2026-07-01": "特區成立日",
      "2026-09-26": "中秋節翌日",
      "2026-10-01": "國慶日",
      "2026-10-19": "重陽節翌日",
      "2026-12-25": "聖誕節",
      "2026-12-26": "節禮日",
      "2027-01-01": "元旦",
      "2027-02-06": "農曆年初一",
      "2027-02-08": "農曆年初三",
      "2027-02-09": "農曆年初四",
      "2027-03-26": "耶穌受難節",
      "2027-03-29": "復活節星期一",
      "2027-04-05": "清明節",
      "2027-05-01": "勞動節",
      "2027-05-13": "佛誕",
      "2027-06-09": "端午節",
      "2027-07-01": "特區成立紀念日",
      "2027-09-16": "中秋節翌日",
      "2027-10-01": "國慶日",
      "2027-10-08": "重陽節",
      "2027-12-25": "聖誕節",
      "2027-12-27": "節禮日"
    };

    function parseEventSummary(rawText) {
      const text = (rawText || "").trim();
      const firstSpaceIdx = text.indexOf(" ");
      if (firstSpaceIdx > 0) {
        return {
          name: text.substring(0, firstSpaceIdx).trim(),
          status: text.substring(firstSpaceIdx + 1).trim()
        };
      }
      const bracketMatch = text.match(/^([^(（]+)[(（]([^)）]+)[)）]$/);
      if (bracketMatch) {
        return {
          name: bracketMatch[1].trim(),
          status: bracketMatch[2].trim()
        };
      }
      return {
        name: text,
        status: "放假"
      };
    }

    let teamEvents = [];
    // 預設為當前月份
    let currentDate = new Date();
    let selectedDateStr = fmtDate(new Date());

    function fmtDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById("monthDisplay").textContent = `${year}年 ${month + 1}月`;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const firstDay = new Date(year, month, 1);
      const startDayOfWeek = firstDay.getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const todayStr = fmtDate(new Date());

      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const d = new Date(year, month - 1, prevMonthDays - i);
        grid.appendChild(createCell(d, true));
      }

      for (let day = 1; day <= totalDays; day++) {
        const d = new Date(year, month, day);
        grid.appendChild(createCell(d, false, todayStr));
      }

      const currentCells = grid.children.length;
      const remaining = (7 - (currentCells % 7)) % 7;
      for (let j = 1; j <= remaining; j++) {
        const d = new Date(year, month + 1, j);
        grid.appendChild(createCell(d, true));
      }

      updateDetailTray(selectedDateStr);
    }

    function createCell(dateObj, isOtherMonth, todayStr) {
      const cell = document.createElement("div");
      const dayOfWeek = dateObj.getDay();
      const dateStr = fmtDate(dateObj);

      cell.className = "cell";
      if (dayOfWeek === 0) cell.classList.add("sun-col");
      if (dayOfWeek === 6) cell.classList.add("sat-col");
      if (isOtherMonth) cell.classList.add("other-month");
      if (dateStr === todayStr) cell.classList.add("today");

      const topBar = document.createElement("div");
      topBar.className = "cell-top";

      const num = document.createElement("span");
      num.className = "day-num";
      num.textContent = dateObj.getDate();
      topBar.appendChild(num);

      const phName = HK_PUBLIC_HOLIDAYS[dateStr];
      if (phName) {
        const ph = document.createElement("span");
        ph.className = "ph-label";
        ph.textContent = phName;
        topBar.appendChild(ph);
        cell.classList.add("sun-col");
      }
      cell.appendChild(topBar);

      const stream = document.createElement("div");
      stream.className = "event-stream";

      if (phName) {
        const phCard = document.createElement("div");
        phCard.className = "item-card ph";
        phCard.innerHTML = `<span class="name-line">${phName}</span>`;
        stream.appendChild(phCard);
      }

      const evts = teamEvents.filter(e => e.date === dateStr);
      const maxShow = 2;
      evts.slice(0, maxShow).forEach(e => {
        const parsed = parseEventSummary(e.raw);
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <span class="name-line">${parsed.name}</span>
          <span class="status-line">${parsed.status}</span>
        `;
        stream.appendChild(card);
      });

      if (evts.length > maxShow) {
        const more = document.createElement("div");
        more.className = "more-counter";
        more.textContent = `+${evts.length - maxShow} 人`;
        stream.appendChild(more);
      }

      cell.appendChild(stream);

      cell.onclick = () => {
        selectedDateStr = dateStr;
        updateDetailTray(dateStr);
      };

      return cell;
    }

    function updateDetailTray(dateStr) {
      const parts = dateStr.split("-");
      document.getElementById("trayDateText").textContent = `${parts[0]}年${parts[1]}月${parts[2]}日`;
      
      const trayList = document.getElementById("trayList");
      trayList.innerHTML = "";

      const ph = HK_PUBLIC_HOLIDAYS[dateStr];
      const evts = teamEvents.filter(e => e.date === dateStr);

      document.getElementById("trayCountText").textContent = `${evts.length} 人休假`;

      if (ph) {
        const chip = document.createElement("div");
        chip.className = "person-chip chip-ph";
        chip.textContent = `🏮 公眾假期：${ph}`;
        trayList.appendChild(chip);
      }

      if (evts.length === 0 && !ph) {
        trayList.textContent = "全體正常當值 (無人請假)";
        return;
      }

      evts.forEach(e => {
        const parsed = parseEventSummary(e.raw);
        const chip = document.createElement("div");
        chip.className = "person-chip";
        chip.innerHTML = `
          <span class="chip-name">👤 ${parsed.name}</span>
          <span class="chip-desc">${parsed.status}</span>
        `;
        trayList.appendChild(chip);
      });
    }

// 官方專屬管道（免 Proxy、零阻擋、秒變綠燈）
    async function loadGoogleIcal() {
      const dot = document.getElementById("syncDot");
      dot.style.background = "#fbbc04"; // 黃燈：同步中

      // 請將引號內的網址換成你在第一步複製到的 Google Apps Script 網址
      const apiUrl = "https://script.google.com/macros/s/AKfycbzArHbFKnOKuHd57pkToChGrYcSUGBp1BsIx_S3LRQEirs46IxEP4F-O-AU7uHZZigqAA/exec";

      try {
        const res = await fetch(apiUrl);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            teamEvents = data;
            renderCalendar();
            dot.style.background = "#34a853"; // 綠燈：成功！
            return;
          }
        }
        throw new Error("API response error");
      } catch (e) {
        console.warn("同步失敗", e);
        dot.style.background = "#ea4335"; // 紅燈
      }
    }

    // 支援「全天」、「普通時間」及「跨多天請假」
    function parseIcsText(ics) {
      const lines = ics.split(/\r\n|\n|\r/);
      let insideEvent = false;
      let curSummary = "";
      let dtStart = "";
      let dtEnd = "";
      const parsed = [];

      for (let line of lines) {
        if (line.startsWith("BEGIN:VEVENT")) {
          insideEvent = true;
          curSummary = "";
          dtStart = "";
          dtEnd = "";
        } else if (line.startsWith("END:VEVENT")) {
          if (dtStart && curSummary) {
            // 如果只有一天
            if (!dtEnd || dtEnd <= dtStart) {
              parsed.push({ date: dtStart, raw: curSummary });
            } else {
              // 跨天循環填入
              let cur = new Date(dtStart);
              const end = new Date(dtEnd);
              while (cur < end) {
                parsed.push({ date: fmtDate(cur), raw: curSummary });
                cur.setDate(cur.getDate() + 1);
              }
            }
          }
          insideEvent = false;
        } else if (insideEvent) {
          if (line.startsWith("SUMMARY:")) {
            curSummary = line.replace("SUMMARY:", "").trim();
          }
          if (line.startsWith("DTSTART")) {
            const val = line.split(":")[1]?.trim();
            if (val) dtStart = `${val.slice(0,4)}-${val.slice(4,6)}-${val.slice(6,8)}`;
          }
          if (line.startsWith("DTEND")) {
            const val = line.split(":")[1]?.trim();
            if (val) dtEnd = `${val.slice(0,4)}-${val.slice(4,6)}-${val.slice(6,8)}`;
          }
        }
      }

      if (parsed.length > 0) {
        teamEvents = parsed;
      }
    }

    function manualRefresh() {
      const targetIcs = "https://calendar.google.com/calendar/ical/6dd388163940311c287810b7326825381de533b9216ca69b81bce5773b9f3aeb%40group.calendar.google.com/public/basic.ics";
      loadGoogleIcal(targetIcs);
    }

    document.getElementById("prevBtn").onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    };
    document.getElementById("nextBtn").onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    };
    document.getElementById("todayBtn").onclick = () => {
      currentDate = new Date();
      selectedDateStr = fmtDate(currentDate);
      renderCalendar();
    };

    // 首次渲染
    renderCalendar();

    // 自動拉取日曆
    const targetIcs = "https://calendar.google.com/calendar/ical/6dd388163940311c287810b7326825381de533b9216ca69b81bce5773b9f3aeb%40group.calendar.google.com/public/basic.ics";
    loadGoogleIcal(targetIcs);
  </script>
</body>
</html>
